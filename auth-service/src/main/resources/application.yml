server:
  port: 8081

spring:
  main:
    allow-circular-references: true
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/online_judge}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
    show-sql: false
  flyway:
    enabled: true
    schemas: auth
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLong!!}
  access-token-expiry: 900000      # 15 minutes
  refresh-token-expiry: 604800000  # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info