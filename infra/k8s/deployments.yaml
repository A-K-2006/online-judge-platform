# --- Execution Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: online-judge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      serviceAccountName: execution-sa
      containers:
        - name: execution-service
          image: ACR_NAME.azurecr.io/execution-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef: { name: redis-secrets, key: host }
            - name: EXECUTION_NAMESPACE
              value: online-judge
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits: { memory: "1Gi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
  namespace: online-judge
spec:
  selector:
    app: execution-service
  ports:
    - port: 8085
      targetPort: 8085