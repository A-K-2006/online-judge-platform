version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: online_judge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api-gateway:
    build:
      context: ../..
      dockerfile: api-gateway/Dockerfile
    ports: ["8080:8080"]
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      PROBLEM_SERVICE_URL: http://problem-service:8083
      SUBMISSION_SERVICE_URL: http://submission-service:8084
    depends_on: [auth-service, user-service, problem-service, submission-service]

  auth-service:
    build:
      context: ../..
      dockerfile: auth-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: online_judge
    depends_on: [postgres]

  user-service:
    build:
      context: ../..
      dockerfile: user-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: online_judge
    depends_on: [postgres]

  problem-service:
    build:
      context: ../..
      dockerfile: problem-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: online_judge
    depends_on: [postgres]

  submission-service:
    build:
      context: ../..
      dockerfile: submission-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: online_judge
      REDIS_HOST: redis
      PROBLEM_SERVICE_URL: http://problem-service:8083
    depends_on: [postgres, redis, problem-service]

  execution-service:
    build:
      context: ../..
      dockerfile: execution-service/Dockerfile
    environment:
      REDIS_HOST: redis
    depends_on: [redis]

volumes:
  pgdata: