server:
  port: 8084
spring:
  application:
    name: submission-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/online_judge}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: submissions
  flyway:
    enabled: true
    schemas: submissions
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  services:
    problem:
      url: ${PROBLEM_SERVICE_URL:http://localhost:8083}
  jwt:
    secret: ${JWT_SECRET:YourSuperSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLong!!}
  management:
    endpoints:
      web:
        exposure:
          include: health,info