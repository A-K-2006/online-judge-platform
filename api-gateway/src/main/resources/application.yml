server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**

        - id: problem-service
          uri: ${PROBLEM_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/problems/**

        - id: submission-service
          uri: ${SUBMISSION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/submissions/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
