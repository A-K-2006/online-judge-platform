<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title description">
  <title id="title">Online Judge Platform Microservices Architecture</title>
  <desc id="description">Architecture diagram showing gateway routing, domain services, shared PostgreSQL schemas, JWT validation, and asynchronous submission execution through Redis and Kubernetes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrowSmall" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .muted { fill: #5a6778; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: .7px; fill: #5a6778; }
      .title { font-size: 38px; font-weight: 750; }
      .subtitle { font-size: 18px; }
      .card-title { font-size: 18px; font-weight: 700; }
      .card-sub { font-size: 13px; fill: #5a6778; }
      .label { font-size: 12px; fill: #5a6778; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrowSmall); }
      .box { stroke: #94a3b8; stroke-width: 1.5; rx: 15; }
      .panel { fill: #fff; stroke: #a8b2c0; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#f8fafd"/>

  <text x="54" y="62" font-size="17" font-weight="700" fill="#2563b4">ONLINE JUDGE PLATFORM</text>
  <text x="54" y="112" class="title">Microservices architecture</text>
  <text x="54" y="149" class="subtitle muted">HTTP routing, JWT authentication, persistence, and asynchronous code execution</text>

  <!-- API entry and routing -->
  <rect x="45" y="190" width="1710" height="177" rx="20" class="panel"/>
  <text x="70" y="222" class="section">CLIENT ENTRY AND API ROUTING</text>
  <rect x="80" y="248" width="260" height="83" rx="15" fill="#e1efff" class="box"/>
  <text x="98" y="282" class="card-title">Web / API client</text>
  <text x="98" y="310" class="card-sub">Calls REST endpoints; sends Bearer JWT</text>
  <rect x="500" y="248" width="330" height="83" rx="15" fill="#efe8ff" class="box"/>
  <text x="518" y="282" class="card-title">API Gateway · :8080</text>
  <text x="518" y="310" class="card-sub">Routes the four public API path groups</text>
  <path d="M340 282H500" class="flow"/>
  <text x="382" y="270" class="label">HTTP requests</text>

  <rect x="1000" y="214" width="310" height="100" rx="15" fill="#def6f1" class="box"/>
  <text x="1018" y="250" class="card-title">Auth Service · :8081</text>
  <text x="1018" y="278" class="card-sub">Register, login, refresh; issues JWTs</text>
  <path d="M830 270H1000" class="flow"/>
  <text x="877" y="258" class="label">/api/v1/auth/**</text>
  <text x="1000" y="344" font-size="14" class="muted">Returns tokens to client; protected services verify JWTs locally</text>

  <!-- Gateway routes -->
  <path d="M665 331L260 445" class="flow"/>
  <text x="390" y="380" class="label">/api/v1/users/**</text>
  <path d="M665 331L682 445" class="flow"/>
  <text x="603" y="390" class="label">/api/v1/problems/**</text>
  <path d="M665 331L1102 445" class="flow"/>
  <text x="818" y="378" class="label">/api/v1/submissions/**</text>

  <!-- Domain services -->
  <text x="54" y="415" class="section">DOMAIN SERVICES</text>
  <rect x="95" y="445" width="335" height="108" rx="15" fill="#e1efff" class="box"/>
  <text x="113" y="481" class="card-title">User Service · :8082</text>
  <text x="113" y="511" class="card-sub">User profiles and profile statistics</text>
  <rect x="515" y="445" width="335" height="108" rx="15" fill="#e1efff" class="box"/>
  <text x="533" y="481" class="card-title">Problem Service · :8083</text>
  <text x="533" y="511" class="card-sub">Problem catalog and problem details</text>
  <rect x="935" y="445" width="335" height="108" rx="15" fill="#def6f1" class="box"/>
  <text x="953" y="481" class="card-title">Submission Service · :8084</text>
  <text x="953" y="511" class="card-sub">Stores submissions and tracks results</text>
  <rect x="1350" y="445" width="350" height="108" rx="15" fill="#fff3da" class="box"/>
  <text x="1368" y="481" class="card-title">Execution Service · :8085</text>
  <text x="1368" y="511" class="card-sub">Consumes execution requests; runs code</text>

  <!-- Shared database -->
  <rect x="45" y="590" width="1080" height="202" rx="20" class="panel"/>
  <text x="70" y="623" class="section">DATA LAYER · SHARED POSTGRESQL, SCHEMA-ISOLATED BY SERVICE</text>
  <rect x="100" y="650" width="960" height="110" rx="15" fill="#ebf0f7" class="box"/>
  <text x="120" y="687" class="card-title">PostgreSQL · :5432</text>
  <text x="120" y="718" class="card-sub">auth.users  |  users.profiles  |  problems.problems  |  submissions.submissions</text>
  <text x="100" y="780" font-size="14" class="muted">Each service connects to this instance using its own schema.</text>
  <path d="M245 553L280 650" class="flow"/>
  <text x="208" y="612" class="label">profiles</text>
  <path d="M682 553L590 650" class="flow"/>
  <text x="605" y="610" class="label">problems</text>
  <path d="M1102 553L890 650" class="flow"/>
  <text x="985" y="610" class="label">submissions</text>
  <path d="M1155 314L1155 393L1015 393L1015 650" class="dashed"/>
  <text x="1020" y="383" class="label">auth schema</text>

  <!-- Kubernetes runner -->
  <rect x="1160" y="590" width="595" height="202" rx="20" class="panel"/>
  <text x="1185" y="623" class="section">KUBERNETES EXECUTION</text>
  <rect x="1240" y="654" width="430" height="95" rx="15" fill="#fff3da" class="box"/>
  <text x="1258" y="691" class="card-title">Short-lived code-runner Job</text>
  <text x="1258" y="720" class="card-sub">Runs submitted code with configured limits and timeout</text>
  <path d="M1525 553L1480 654" class="flow"/>
  <text x="1486" y="610" class="label">create job / collect output</text>

  <!-- Async request / result flow -->
  <rect x="45" y="850" width="1710" height="255" rx="20" class="panel"/>
  <text x="70" y="884" class="section">ASYNCHRONOUS SUBMISSION LIFECYCLE</text>
  <rect x="100" y="925" width="350" height="105" rx="15" fill="#def6f1" class="box"/>
  <text x="118" y="963" class="card-title">1 · Submission Service</text>
  <text x="118" y="992" class="card-sub">Persists PENDING submission; publishes request</text>
  <rect x="535" y="925" width="300" height="105" rx="15" fill="#ffefd4" class="box"/>
  <text x="553" y="963" class="card-title">2 · Redis Pub/Sub · :6379</text>
  <text x="553" y="992" class="card-sub">execution-requests channel</text>
  <rect x="920" y="925" width="350" height="105" rx="15" fill="#fff3da" class="box"/>
  <text x="938" y="963" class="card-title">3 · Execution Service</text>
  <text x="938" y="992" class="card-sub">Consumes request; runs Kubernetes Job</text>
  <rect x="1360" y="925" width="320" height="105" rx="15" fill="#ffefd4" class="box"/>
  <text x="1378" y="963" class="card-title">4 · Redis Pub/Sub</text>
  <text x="1378" y="992" class="card-sub">execution-results channel</text>
  <path d="M450 977H535" class="flow"/>
  <text x="467" y="963" class="label">request</text>
  <path d="M835 977H920" class="flow"/>
  <text x="854" y="963" class="label">consume</text>
  <path d="M1270 977H1360" class="flow"/>
  <text x="1291" y="963" class="label">result</text>
  <path d="M1515 1030V1065H255V1030" class="dashed"/>
  <text x="520" y="1054" class="label">5 · Listener updates submission status, output, runtime, and memory</text>
  <text x="70" y="1081" font-size="14" class="muted">JWT validation is shared code in each service; there is no per-request call to Auth.</text>

  <text x="70" y="1147" font-size="14" class="muted">Solid arrows = active flow · Dashed arrows = shared behavior or asynchronous result return</text>
  <text x="70" y="1173" font-size="13" class="muted">Submission Service declares a ProblemClient, but the current submit flow does not call it.</text>
</svg>
