name: Build and Deploy to Azure AKS

on:
  push:
    branches: [main]

env:
  ACR_NAME: acrolinejudge
  RESOURCE_GROUP: rg-online-judge
  CLUSTER_NAME: aks-online-judge
  NAMESPACE: online-judge

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean package -DskipTests

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Images to ACR
        run: |
          for service in api-gateway auth-service user-service problem-service submission-service execution-service; do
            az acr build --registry $ACR_NAME \
              --image $service:${{ github.sha }} \
              --image $service:latest \
              --file $service/Dockerfile .
          done

      - name: Set AKS Context
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $CLUSTER_NAME

      - name: Deploy to AKS
        run: |
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/rbac.yaml
          
          # Update image tags
          for service in api-gateway auth-service user-service problem-service submission-service execution-service; do
            kubectl set image deployment/$service $service=$ACR_NAME.azurecr.io/$service:${{ github.sha }} -n $NAMESPACE || true
          done
          
          kubectl apply -f infra/k8s/deployments.yaml
          kubectl apply -f infra/k8s/ingress.yaml
          
          # Wait for rollout
          for service in api-gateway auth-service user-service problem-service submission-service execution-service; do
            kubectl rollout status deployment/$service -n $NAMESPACE --timeout=300s
          done